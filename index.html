<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Regno Parole"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#7FD3FF"><title>Il Regno delle Parole</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Direzione: blocchetti dell'alfabeto di legno colorato su un mondo da fiaba. Gioco per bambini: un solo aspetto luminoso, scelto apposta. */
:root {
  --ink: #2A1F5C; --ink2: #5B4F8F; --paper: #FFFFFF;
  --grape: #6B46E5; --grape-d: #4B2FB8; --sun: #FFC83D; --sun-d: #E0A100;
  --mint: #2FCB8E; --mint-d: #17A06E; --coral: #FF6B5B; --coral-d: #D84A3B; --sky: #2BA8F0; --sky-d: #1C84C4;
  --sky1: #7FD3FF; --sky2: #DDF6FF; --hill: #3FC79A; --hill2: #27A57F; --acc: #FF8A3D;
  --f-display: 'Baloo 2', 'Nunito', 'Trebuchet MS', system-ui, sans-serif;
  --f-body: 'Nunito', system-ui, -apple-system, sans-serif;
  --tile: clamp(52px, 14vw, 84px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--sky2); color: var(--ink); font-family: var(--f-body); font-size: 18px; font-weight: 700;
  overflow-x: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
button { font: inherit; color: inherit; border: 0; cursor: pointer; }
button:focus-visible { outline: 4px solid var(--grape); outline-offset: 3px; }
.lc .tile, .lc .opt, .lc .slot, .lc .bigword, .lc .sent, .lc .hole, .lc .bub, .lc .sline { text-transform: lowercase; }
.nocase, .lc .nocase { text-transform: none !important; }

/* ---------- scena ---------- */
#scene { position: fixed; inset: 0; z-index: 0; background: linear-gradient(180deg, var(--sky1), var(--sky2) 72%); transition: background .8s; overflow: hidden; }
.cloud { position: absolute; left: -200px; width: 150px; height: 46px; background: #fff; border-radius: 46px; opacity: .8; animation: drift linear infinite; }
.cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
.cloud::before { width: 62px; height: 62px; left: 22px; top: -30px; }
.cloud::after { width: 46px; height: 46px; left: 78px; top: -20px; }
.cloud.c1 { top: 11%; animation-duration: 90s; }
.cloud.c2 { top: 26%; transform: scale(.7); animation-duration: 130s; animation-delay: -50s; opacity: .65; }
.cloud.c3 { top: 5%; transform: scale(1.2); animation-duration: 170s; animation-delay: -110s; opacity: .55; }
@keyframes drift { to { left: 110%; } }
.hills { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 34%; display: block; }
.hills .h1 { fill: var(--hill2); transition: fill .8s; }
.hills .h2 { fill: var(--hill); transition: fill .8s; }

#app { position: relative; z-index: 1; min-height: 100%; display: flex; flex-direction: column; padding-block: 10px 18px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#screen { flex: 1; display: flex; flex-direction: column; width: 100%; max-width: 760px; margin: 0 auto; min-width: 0; }

/* ---------- barra alta ---------- */
.hud { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 760px; margin: 0 auto 8px; min-width: 0; }
.hud .sp { flex: 1; }
.rbtn { width: 46px; height: 46px; border-radius: 50%; background: var(--paper); color: var(--grape); box-shadow: 0 4px 0 rgba(42,31,92,.18); display: grid; place-items: center; flex: none; position: relative; font-family: var(--f-display); font-weight: 800; font-size: 18px; }
.rbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(42,31,92,.18); }
.rbtn svg { width: 26px; height: 26px; }
.rbtn.off { color: #A49CC8; }
.rbtn.off::after { content: ""; position: absolute; width: 30px; height: 4px; border-radius: 3px; background: var(--coral); transform: rotate(-45deg); }
.starcount { display: flex; align-items: center; gap: 6px; background: var(--paper); border-radius: 24px; padding: 6px 14px 6px 10px; box-shadow: 0 4px 0 rgba(42,31,92,.18); font-family: var(--f-display); font-weight: 800; font-size: 22px; line-height: 1; }
.starcount svg { width: 26px; height: 26px; }

/* ---------- mascotte ---------- */
.fox { width: 92px; height: 92px; flex: none; animation: floaty 3.4s ease-in-out infinite; transform-origin: 50% 90%; }
.fox svg { width: 100%; height: 100%; overflow: visible; display: block; }
.fox .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
.fox.happy { animation: hop .7s ease-out; }
.fox.oops { animation: tilt .6s ease-in-out; }
.fox.big { width: clamp(130px, 34vw, 200px); height: clamp(130px, 34vw, 200px); }
@keyframes floaty { 50% { transform: translateY(-6px); } }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
@keyframes hop { 0% { transform: translateY(0) scale(1); } 30% { transform: translateY(-26px) scale(1.06, .96); } 60% { transform: translateY(0) scale(.96, 1.05); } 100% { transform: none; } }
@keyframes tilt { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-9deg); } 75% { transform: rotate(7deg); } }

/* ---------- pulsanti grandi ---------- */
.cta { background: var(--mint); color: #fff; font-family: var(--f-display); font-weight: 800; font-size: clamp(24px, 6vw, 34px); letter-spacing: .02em; padding: 12px 38px 10px; border-radius: 40px; box-shadow: 0 7px 0 var(--mint-d); text-shadow: 0 2px 0 rgba(0,0,0,.14); min-height: 64px; }
.cta:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--mint-d); }
.cta.grape { background: var(--grape); box-shadow: 0 7px 0 var(--grape-d); }
.cta.coral { background: var(--coral); box-shadow: 0 7px 0 var(--coral-d); }
.cta.sun { background: var(--sun); color: var(--ink); text-shadow: none; box-shadow: 0 7px 0 var(--sun-d); }
.cta.pulse { animation: pulse 1.3s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }
.pill { background: var(--paper); color: var(--grape-d); font-family: var(--f-display); font-weight: 800; font-size: 18px; padding: 8px 18px 6px; border-radius: 30px; box-shadow: 0 4px 0 rgba(42,31,92,.18); display: inline-flex; align-items: center; gap: 8px; min-height: 46px; }
.pill:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(42,31,92,.18); }
.pill svg { width: 22px; height: 22px; }
.ghost { background: rgba(255,255,255,.7); color: var(--grape-d); font-weight: 800; padding: 10px 20px; border-radius: 30px; min-height: 46px; }

/* ---------- benvenuto ---------- */
.welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding-block: 8px; }
.logo { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.logo .row { display: flex; gap: 4px; justify-content: center; }
.logo .gap { width: .5em; }
.blk { --s: clamp(24px, 6.7vw, 56px); width: var(--s); height: var(--s); display: grid; place-items: center; border-radius: 22%; color: #fff; font-family: var(--f-display); font-weight: 800; font-size: calc(var(--s) * .78); line-height: 1; padding-top: calc(var(--s) * .06); text-shadow: 0 2px 0 rgba(0,0,0,.16); box-shadow: 0 calc(var(--s) * .1) 0 rgba(0,0,0,.2), inset 0 calc(var(--s) * -.06) 0 rgba(0,0,0,.12); animation: blockin .6s backwards cubic-bezier(.3, 1.6, .5, 1); }
@keyframes blockin { from { transform: translateY(-40px) scale(.4) rotate(var(--r, 0deg)); opacity: 0; } }
.ded { margin: 0; font-size: clamp(18px, 4.4vw, 24px); color: var(--ink); background: rgba(255,255,255,.75); padding: 10px 20px; border-radius: 22px; max-width: 30ch; line-height: 1.3; }
.ded b { color: var(--coral-d); font-family: var(--f-display); font-weight: 800; }

/* ---------- mappa ---------- */
.mapTop { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.bubble { position: relative; background: var(--paper); border-radius: 22px; padding: 12px 16px; flex: 1; min-width: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(20px, 5vw, 26px); line-height: 1.15; box-shadow: 0 5px 0 rgba(42,31,92,.14); display: flex; align-items: center; gap: 10px; min-height: 64px; }
.bubble::before { content: ""; position: absolute; left: -10px; top: 50%; margin-top: -10px; border: 10px solid transparent; border-left: 0; border-right-color: var(--paper); }
.bubble .pt { flex: 1; min-width: 0; text-wrap: balance; }
.spk { width: 46px; height: 46px; border-radius: 50%; background: var(--sky); color: #fff; flex: none; display: grid; place-items: center; box-shadow: 0 4px 0 var(--sky-d); }
.spk.big { width: 84px; height: 84px; }
.spk.big svg { width: 44px; height: 44px; }
.spk:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--sky-d); }
.spk svg { width: 26px; height: 26px; }
.mapActions { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0 16px; }
.worlds { display: flex; flex-direction: column; gap: 18px; padding-bottom: 28px; position: relative; }
.worlds::before { content: ""; position: absolute; left: 50%; top: 30px; bottom: 60px; border-left: 7px dotted rgba(255,255,255,.9); z-index: 0; }
.world { --w1: #fff; --w2: #eee; position: relative; z-index: 1; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 16px; border-radius: 28px; background: linear-gradient(160deg, var(--w1), var(--w2)); box-shadow: 0 7px 0 rgba(42,31,92,.16); width: min(100%, 520px); min-width: 0; }
.world:nth-child(odd) { align-self: flex-start; }
.world:nth-child(even) { align-self: flex-end; }
.world .wh { display: flex; align-items: center; gap: 12px; min-width: 0; }
.world .wi { width: 62px; height: 62px; border-radius: 20px; background: rgba(255,255,255,.8); display: grid; place-items: center; font-size: 38px; flex: none; }
.world h3 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(20px, 5vw, 25px); line-height: 1.05; text-wrap: balance; }
.world .sub { font-size: 15px; color: var(--ink2); margin-top: 2px; }
.levels { display: flex; gap: 14px; justify-content: space-around; }
.lv { width: 76px; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; padding: 0; }
.lv .dot { width: 62px; height: 62px; border-radius: 50%; background: var(--paper); color: var(--grape-d); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 30px; box-shadow: 0 5px 0 rgba(42,31,92,.2); padding-top: 4px; }
.lv:active .dot { transform: translateY(4px); box-shadow: 0 1px 0 rgba(42,31,92,.2); }
.lv.cur .dot { background: var(--sun); color: var(--ink); animation: pulse 1.3s ease-in-out infinite; box-shadow: 0 5px 0 var(--sun-d), 0 0 0 7px rgba(255,200,61,.45); }
.lv.done .dot { background: var(--mint); color: #fff; box-shadow: 0 5px 0 var(--mint-d); }
.lv.lock .dot { background: #D9D4EA; color: #A49CC8; box-shadow: 0 5px 0 #B9B2D4; }
.lv.lock { cursor: default; }
.lv .dot svg { width: 26px; height: 26px; }
.stars { display: flex; gap: 1px; height: 18px; }
.stars svg { width: 18px; height: 18px; }
.world.lockedw { filter: saturate(.55); opacity: .85; }

/* ---------- gioco ---------- */
.act { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.pips { display: flex; gap: 7px; flex: 1; justify-content: center; }
.pip { width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,.75); box-shadow: inset 0 -3px 0 rgba(42,31,92,.15); }
.pip.done { background: var(--mint); }
.pip.now { background: var(--sun); transform: scale(1.35); }
.coach { display: flex; align-items: center; gap: 10px; }
.coach .fox { width: 76px; height: 76px; }
.coach .bubble { min-height: 56px; padding: 8px 12px; }
.stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(10px, 2.4vh, 22px); min-height: 0; padding-block: 4px; width: 100%; }
.pic { font-size: clamp(76px, 19vmin, 138px); line-height: 1; filter: drop-shadow(0 6px 0 rgba(42,31,92,.15)); animation: popin .45s backwards cubic-bezier(.3, 1.6, .5, 1); text-align: center; word-break: keep-all; }
.pic.sm { font-size: clamp(60px, 14vmin, 104px); }
@keyframes popin { from { transform: scale(.3); opacity: 0; } }
.bigword { font-family: var(--f-display); font-weight: 800; font-size: clamp(40px, 11vw, 76px); letter-spacing: .04em; line-height: 1; text-align: center; background: var(--paper); border-radius: 22px; padding: 10px 22px 6px; box-shadow: 0 6px 0 rgba(42,31,92,.14); max-width: 100%; overflow-wrap: anywhere; }
.bigword .hole, .hole { display: inline-block; min-width: .8em; border-bottom: 6px solid var(--coral); color: var(--coral); text-align: center; margin: 0 .04em; }
.hole.ok { color: var(--mint-d); border-color: var(--mint); animation: popin .4s; }
.opts { display: flex; flex-wrap: wrap; gap: clamp(10px, 3vw, 20px); justify-content: center; width: 100%; }
.tile, .opt { min-width: var(--tile); height: var(--tile); padding: 0 calc(var(--tile) * .2); padding-top: calc(var(--tile) * .07); border-radius: 20px; background: var(--paper); color: var(--grape-d); font-family: var(--f-display); font-weight: 800; font-size: calc(var(--tile) * .62); line-height: 1; box-shadow: 0 6px 0 rgba(42,31,92,.22); display: inline-flex; align-items: center; justify-content: center; position: relative; animation: popin .4s backwards cubic-bezier(.3, 1.6, .5, 1); }
.tile:active, .opt:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(42,31,92,.22); }
.opt.wide { font-size: calc(var(--tile) * .5); }
.opt.pic2 { font-size: clamp(54px, 13vmin, 92px); height: auto; min-height: var(--tile); padding: 8px 18px; }
.tile.c0 { background: #FFE1DC; color: var(--coral-d); } .tile.c1 { background: #DDF3FF; color: var(--sky-d); } .tile.c2 { background: #E6FBD9; color: #2E8B1F; } .tile.c3 { background: #FFF1C2; color: #A87500; } .tile.c4 { background: #EADFFF; color: var(--grape-d); }
.tile.used { visibility: hidden; }
.opt.right, .tile.right { background: var(--mint); color: #fff; box-shadow: 0 6px 0 var(--mint-d); animation: hop .6s; }
.opt.wrong, .tile.wrong { animation: shake .45s; background: #FFE1DC; }
.opt[disabled] { pointer-events: none; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(4px); } }
.slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; max-width: 100%; }
.syl { display: flex; gap: 5px; padding: 8px 9px 6px; border-radius: 20px; background: rgba(255,255,255,.62); }
.slot { width: calc(var(--tile) * .82); height: calc(var(--tile) * 1.05); border-bottom: 6px solid var(--ink2); border-radius: 8px 8px 0 0; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: calc(var(--tile) * .72); line-height: 1; padding-top: calc(var(--tile) * .08); color: var(--grape-d); }
.slot.ghost { color: rgba(75,47,184,.2); }
.slot.cur { border-color: var(--sun-d); background: rgba(255,200,61,.22); }
.slot.fill { animation: popin .35s cubic-bezier(.3, 1.6, .5, 1); border-color: var(--mint); color: var(--mint-d); }
.slots.done .slot { color: var(--mint-d); border-color: var(--mint); }
.hintbtn { background: var(--sun); color: var(--ink); border-radius: 28px; padding: 8px 18px 6px; font-family: var(--f-display); font-weight: 800; font-size: 18px; box-shadow: 0 4px 0 var(--sun-d); min-height: 44px; }
.dock { display: flex; justify-content: center; min-height: 78px; align-items: flex-end; }

/* bolle */
.field { position: relative; width: 100%; flex: 1; min-height: 300px; border-radius: 28px; background: rgba(255,255,255,.35); overflow: hidden; touch-action: manipulation; }
.bub { position: absolute; left: 0; top: 0; width: 92px; height: 92px; border-radius: 50%; background: radial-gradient(circle at 30% 28%, #fff 0 12%, rgba(255,255,255,.55) 13% 30%, rgba(160,225,255,.75) 62%, rgba(120,190,255,.9)); border: 3px solid rgba(255,255,255,.9); box-shadow: inset 0 -6px 14px rgba(70,120,255,.28); font-family: var(--f-display); font-weight: 800; font-size: 40px; color: var(--grape-d); display: grid; place-items: center; padding-top: 6px; will-change: transform; }
.bub.pop { animation: bpop .35s forwards; pointer-events: none; }
@keyframes bpop { 40% { transform: var(--tr) scale(1.35); opacity: .9; } to { transform: var(--tr) scale(1.9); opacity: 0; } }
.bub.wob { animation: bwob .45s; }
@keyframes bwob { 0%, 100% { transform: var(--tr); } 25% { transform: var(--tr) rotate(-14deg) scale(1.08); } 75% { transform: var(--tr) rotate(14deg) scale(1.08); } }
.bubinfo { position: absolute; left: 12px; top: 10px; display: flex; gap: 6px; }
.bubinfo i { width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,.8); box-shadow: inset 0 -3px 0 rgba(42,31,92,.15); }
.bubinfo i.on { background: var(--sun); }

/* ripasso lettera */
.tracewrap { position: relative; width: min(84vw, 380px, 46vh); aspect-ratio: 1; background: var(--paper); border-radius: 34px; box-shadow: 0 7px 0 rgba(42,31,92,.16); overflow: hidden; }
.tracewrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.meter { width: min(84vw, 380px); height: 16px; border-radius: 10px; background: rgba(255,255,255,.7); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--mint); border-radius: 10px; transition: width .15s; }

/* collega */
.mcols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; width: 100%; max-width: 560px; align-items: center; }
.mcols .opt { width: 100%; }
.mcols .opt.sel { background: var(--sun); box-shadow: 0 6px 0 var(--sun-d); }
.mcols .opt.done { background: var(--mint); color: #fff; box-shadow: 0 6px 0 var(--mint-d); opacity: .85; pointer-events: none; }
.mcols .opt.wordc { font-size: clamp(22px, 5.6vw, 36px); letter-spacing: .03em; min-height: var(--tile); overflow-wrap: anywhere; }

/* frase */
.sline { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: calc(var(--tile) * 1.2); width: 100%; padding: 10px; border-radius: 22px; background: rgba(255,255,255,.62); border-bottom: 6px solid var(--ink2); align-items: center; }
.sline .tile.ph { background: transparent; box-shadow: none; }
.tile.wtile { font-size: calc(var(--tile) * .46); letter-spacing: .03em; }
.sent { font-family: var(--f-display); font-weight: 800; font-size: clamp(28px, 7.5vw, 50px); line-height: 1.15; text-align: center; background: var(--paper); border-radius: 22px; padding: 12px 20px 8px; box-shadow: 0 6px 0 rgba(42,31,92,.14); text-wrap: balance; }

/* vittoria */
.win { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; }
.win h2 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(34px, 9vw, 54px); line-height: 1; }
.bigstars { display: flex; gap: 8px; }
.bigstars svg { width: clamp(56px, 16vw, 86px); height: clamp(56px, 16vw, 86px); animation: starin .6s backwards cubic-bezier(.3, 1.8, .5, 1); }
.bigstars svg:nth-child(2) { animation-delay: .25s; } .bigstars svg:nth-child(3) { animation-delay: .5s; }
@keyframes starin { from { transform: scale(0) rotate(-120deg); opacity: 0; } }
.sticker { font-size: clamp(90px, 24vmin, 150px); line-height: 1; background: var(--paper); border-radius: 36px; padding: 10px 24px; box-shadow: 0 8px 0 rgba(42,31,92,.16), 0 0 0 8px rgba(255,200,61,.55); animation: stk 1s .8s backwards cubic-bezier(.3, 1.6, .5, 1); }
@keyframes stk { from { transform: scale(0) rotate(30deg); opacity: 0; } }
.win .lbl { background: rgba(255,255,255,.8); padding: 6px 16px; border-radius: 20px; font-family: var(--f-display); font-size: 22px; }
.rowbtns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

/* album */
.album { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 12px; padding-bottom: 24px; }
.slotk { aspect-ratio: 1; background: rgba(255,255,255,.85); border-radius: 22px; display: grid; place-items: center; font-size: 52px; box-shadow: 0 5px 0 rgba(42,31,92,.14); position: relative; }
.slotk.no { font-size: 38px; color: #C7C0E2; font-family: var(--f-display); font-weight: 800; background: rgba(255,255,255,.5); }
.pagehead { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.pagehead h2 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(26px, 7vw, 38px); flex: 1; line-height: 1; }

/* diploma */
.diploma { background: var(--paper); border-radius: 30px; padding: 22px 18px; text-align: center; box-shadow: 0 8px 0 rgba(42,31,92,.16), inset 0 0 0 8px #FFE9A8; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.diploma h2 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: clamp(28px, 8vw, 46px); color: var(--grape-d); line-height: 1; }

const ALLWORDS = {};
Object.values(POOLS).forEach(p => p.forEach(o => { if (!ALLWORDS[o.w]) ALLWORDS[o.w] = o; }));

/* ---------- utilità ---------- */
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = rnd(i + 1); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const sample = (a, n) => shuffle(a).slice(0, n);
const uniq = a => [...new Set(a)];

/* ---------- mondi ---------- */
const WORLDS = [
  { id: 'vocali', name: 'Isola delle Vocali', sub: 'A E I O U', icon: '🏝️', sky: ['#7FD3FF', '#DDF6FF'], hill: '#3FC79A', hill2: '#27A57F', acc: '#FF8A3D', key: 0, words: 'vowels' },
  { id: 'sillabe', name: 'Prato delle Sillabe', sub: 'MA PE LI TO NU', icon: '🌼', sky: ['#FFC8A2', '#FFEFD9'], hill: '#7BD36B', hill2: '#55B64B', acc: '#E8457C', key: 2, words: 'cv' },

  { id: 'spiaggia', name: 'Spiaggia delle Parole Lunghe', sub: 'Tre, quattro sillabe', icon: '🏖️', sky: ['#8FE0F0', '#FFF4C9'], hill: '#F4D58D', hill2: '#E7B95C', acc: '#00A3A3', key: 7, words: 'long' },
  { id: 'doppie', name: 'Montagna delle Doppie', sub: 'TT LL NN PP', icon: '⛰️', sky: ['#C7B8FF', '#F0EBFF'], hill: '#8F7BE8', hill2: '#6D58C9', acc: '#FF7043', key: 9, words: 'double' },
  { id: 'chgh', name: 'Castello di CHI e GHI', sub: 'CHI CHE GHI GHE', icon: '🏰', sky: ['#FFB4C8', '#FFE8EF'], hill: '#E58AA6', hill2: '#C86484', acc: '#3949AB', key: 3, words: 'chgh' },
  { id: 'cigi', name: 'Valle di CI e GI', sub: 'CI CE GI GE', icon: '🌈', sky: ['#9EE6D6', '#E3FBF5'], hill: '#4CC9A8', hill2: '#2BA987', acc: '#F4511E', key: 10, words: 'cigi' },
  { id: 'gnglisc', name: 'Laguna di GN, GLI, SC', sub: 'RAGNO FOGLIA PESCE', icon: '🐚', sky: ['#86D6FF', '#E6F7FF'], hill: '#3AA7D9', hill2: '#1E82B5', acc: '#EC407A', key: 4, words: 'gnglisc' },
  { id: 'frasi', name: 'Città delle Frasi', sub: 'Riordina e completa', icon: '🏙️', sky: ['#FFD27A', '#FFF1CF'], hill: '#F0A44B', hill2: '#D98524', acc: '#5E35B1', key: 8, words: 'frasi' },
  { id: 'dettato', name: 'Palazzo del Dettato', sub: 'Ascolta e scrivi', icon: '🏛️', sky: ['#C5A8FF', '#F2EAFF'], hill: '#9B73F0', hill2: '#7B52D6', acc: '#FF9800', key: 0, words: 'dettato' }
];

function wordsFor(wi, li) {
  const p = POOLS[WORLDS[wi].words] || POOLS.cv;
  const n = li === 0 ? Math.max(6, Math.ceil(p.length * 0.5)) : li === 1 ? Math.max(8, Math.ceil(p.length * 0.75)) : p.length;
  return p.slice(0, Math.min(n, p.length));
}
const KEYW = w => 'W:' + w.w;

/* ---------- distrattori ---------- */
function similarWords(word, pool, n) {
  const others = pool.filter(o => o.w !== word.w);
  const scored = shuffle(others).map(o => ({ o, s: (o.w[0] === word.w[0] ? 2 : 0) + (Math.abs(o.w.length - word.w.length) <= 1 ? 1 : 0) + Math.random() }));

function consFor(li) { return Math.random() < 0.7 ? pick(CS[li]) : pick(CS.slice(0, li + 1).flat()); }
const vowelsOf = c => (c === 'C' || c === 'G') ? ['A', 'O', 'U'] : VOW;

/* ---------- generatori di attività ---------- */
const GEN = {
  tapLetter(c) {

  initial(c) {

  composeHide(c) { return GEN.compose(c, { model: false, extra: 2 }); },

  },
  wordPickRev(c) { return GEN.wordPick(c, 'word2emoji'); },
  listenPick(c) { return GEN.wordPick(c, 'listen'); },
  listenPickEmoji(c) { return GEN.wordPick(c, 'listenEmoji'); },
  sylMissing(c) {

    return { type: 'match', pairs, key: 'M:' + pairs.map(p => p.w).join(','), prompt: 'Collega ogni disegno alla sua parola', say: 'Collega ogni disegno alla sua parola' };
  },
  gap(c) {
    const pool = wordsFor(c.wi, c.li);
    const w = pick(pool);
    let m, hid, opts, prompt;
    const U = w.w;
    if (c.wi === 4) {
      m = U.match(/(.)\1/); hid = m[0]; opts = shuffle([m[1], m[0]]); prompt = 'Una lettera o due?';
    } else {
      const conf = c.wi === 5
        ? { CHI: ['CI', 'CHE'], CHE: ['CE', 'CHI'], GHI: ['GI', 'GHE'], GHE: ['GE', 'GHI'] }

function sentPool(li) {
  const f = li === 0 ? (s => s.w.length <= 3) : li === 1 ? (s => s.w.length === 4) : (s => s.w.length >= 5);
  const p = SENT.filter(f);

}

  const lim = x => x.w.length <= (li === 0 ? 6 : li === 1 ? 8 : 12);

function buildReview(weak) {
  const entries = Object.entries(weak || {}).sort((a, b) => b[1] - a[1]);
  const words = entries.filter(e => e[0].startsWith('W:') && ALLWORDS[e[0].slice(2)]).map(e => ALLWORDS[e[0].slice(2)]);
  const syls = entries.filter(e => e[0].startsWith('S:')).map(e => e[0].slice(2));
  const acts = [];
  const ws = words.slice(0, 4);
  while (ws.length < 4) { const w = pick(POOLS.cv.concat(POOLS.long, POOLS.double)); if (!ws.includes(w)) ws.push(w); }
  const mk = (w, kind) => {
    const pool = [w, ...similarWords(w, POOLS.cv.concat(POOLS.long, POOLS.double), 4)];
    if (kind === 0) return { type: 'wordPick', mode: 'emoji2word', word: w, options: shuffle([w, ...similarWords(w, pool, 2)]), key: KEYW(w), prompt: 'Quale parola è giusta?', say: 'Quale parola è giusta?', speakTarget: w.w.toLowerCase() };
    if (kind === 1) return { type: 'compose', target: w.w, sylls: w.s, emoji: w.e, model: true, extra: 1, key: KEYW(w), prompt: 'Scrivi la parola', say: w.w.toLowerCase() };
    return { type: 'compose', target: w.w, sylls: w.s, emoji: w.e, model: false, extra: 3, hideEmoji: true, listenFirst: true, key: KEYW(w), prompt: 'Ascolta e scrivi la parola', say: w.w.toLowerCase() };
  };
  ws.forEach((w, i) => acts.push(mk(w, i % 3)));
  syls.slice(0, 2).forEach(s => acts.push({ type: 'compose', target: s, sylls: [s], emoji: null, model: false, extra: 2, key: 'S:' + s, prompt: 'Costruisci la sillaba', say: s.toLowerCase() }));
  while (acts.length < 6) acts.push(mk(ws[acts.length % ws.length], 2));
  return shuffle(acts).slice(0, 6);
}

    setMusic(on) { st.music = on; if (mus) mus.gain.setTargetAtTime(on ? st.duck : 0, ctx.currentTime, 0.05); },

    good() { if (!ctx) return; const t = ctx.currentTime; [72, 76, 79, 84].forEach((n, i) => bell(mtof(n), t + i * 0.08, 0.7, 0.16)); },
    oops() { if (!ctx) return; const t = ctx.currentTime; tone(mtof(62), t, 0.28, { vol: 0.1, a: 0.02 }); tone(mtof(58), t + 0.15, 0.35, { vol: 0.09, a: 0.02 }); },
    bubble() { if (!ctx) return; const t = ctx.currentTime; tone(520, t, 0.12, { vol: 0.14, slide: 1000 }); },
    star(i) { if (!ctx) return; const t = ctx.currentTime; bell(mtof(79 + (i || 0) * 4), t, 1.0, 0.16); },
    win() { if (!ctx) return; const t = ctx.currentTime; [[67, 0], [72, 0.16], [76, 0.32], [79, 0.48], [84, 0.7], [79, 0.95], [84, 1.15]].forEach(([n, d]) => { bell(mtof(n), t + d, 1.1, 0.16); tone(mtof(n - 12), t + d, 0.6, { vol: 0.05, a: 0.02 }); }); },

  };

})();

/* ---------- Voce (sintesi vocale italiana del dispositivo) ---------- */
const Voice = (() => {
  const ss = window.speechSynthesis;
  let voice = null, on = true, gen = 0, unlocked = false;
  function score(v) {
    const id = (v.voiceURI + ' ' + v.name).toLowerCase();
    let s = 0;
    if (/premium/.test(id)) s += 40;
    if (/enhanced|avanzata|migliorata/.test(id)) s += 30;
    if (/siri/.test(id)) s += 28;
    if (/natural|neural|online/.test(id)) s += 35;
    if (/compact/.test(id)) s -= 20;
    ['Alice', 'Federica', 'Paola', 'Elsa', 'Isabella', 'Google italiano', 'Luca'].forEach((n, i) => { if (id.includes(n.toLowerCase())) s += 12 - i; });
    if (v.localService === false && !/online|natural|neural|google/.test(id)) s -= 2;
    return s;
  }
  function load() {
    if (!ss) return;
    const it = (ss.getVoices() || []).filter(v => /^it/i.test((v.lang || '').replace('_', '-')));
    voice = it.length ? it.slice().sort((a, b) => score(b) - score(a))[0] : null;
  }
  if (ss) { load(); if (ss.addEventListener) ss.addEventListener('voiceschanged', load); else ss.onvoiceschanged = load; }
  return {
    available: !!ss,
    name() { load(); return voice ? voice.name : ''; },
    unlock() { if (!ss || unlocked) return; unlocked = true; try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; ss.speak(u); } catch (e) { } },
    setOn(v) { on = v; if (!v) this.stop(); },
    stop() { gen++; try { ss && ss.cancel(); } catch (e) { } Aud.duck(false); },
    say(text, o) {
      o = o || {};
      return new Promise(res => {
        if (!ss || !on || !text) { res(); return; }
        const my = ++gen;
        try { ss.cancel(); } catch (e) { }
        setTimeout(() => {
          if (my !== gen) { res(); return; }
          const u = new SpeechSynthesisUtterance(String(text).toLowerCase());
          u.lang = 'it-IT'; if (voice) u.voice = voice;
          u.rate = o.rate || 0.86; u.pitch = o.pitch || 1.0; u.volume = 1;
          let done = false;
          const fin = () => { if (done) return; done = true; if (my === gen) Aud.duck(false); res(); };
          u.onstart = () => Aud.duck(true);
          u.onend = fin; u.onerror = fin;
          setTimeout(fin, 9000);
          try { ss.speak(u); } catch (e) { fin(); }
        }, 60);
      });
    }
  };
})();

let confRaf = 0;
function confetti(n) {
  let c = $('#conf'); if (!c) { c = el('canvas'); c.id = 'conf'; document.body.appendChild(c); }
  const W = c.width = innerWidth, H = c.height = innerHeight, x = c.getContext('2d');
  const cols = ['#FF6B5B', '#FFC83D', '#2FCB8E', '#2BA8F0', '#6B46E5', '#FF8FB8'];
  const ps = Array.from({ length: n || 80 }, () => ({ x: W / 2 + (Math.random() - .5) * W * .3, y: H * .55, vx: (Math.random() - .5) * 14, vy: -8 - Math.random() * 12, r: 5 + Math.random() * 6, c: pick(cols), a: Math.random() * 6, va: (Math.random() - .5) * .4 }));
  cancelAnimationFrame(confRaf); let t0 = performance.now();
  (function f(t) {
    const age = t - t0; x.clearRect(0, 0, W, H);
    ps.forEach(p => { p.vy += .45; p.x += p.vx; p.y += p.vy; p.a += p.va; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.globalAlpha = Math.max(0, 1 - age / 2200); x.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); x.restore(); });
    if (age < 2200) confRaf = requestAnimationFrame(f); else x.clearRect(0, 0, W, H);
  })(t0);
}

/* ---------- gioco: struttura ---------- */
function startLevel(wi, li) {
  App.play = { wi, li, acts: buildLevel(wi, li), i: 0, mist: 0, review: false };
  Aud.setMood('play', WORLDS[wi].key); setTint(wi); renderAct();
}
function startReview() {
  startAudio();
  App.play = { wi: 0, li: 0, acts: buildReview(SAVE.weak), i: 0, mist: 0, review: true };
  Aud.setMood('play', 7); setTint(2); renderAct();
}
function renderAct() {
  cleanup(); App.view = 'play';
  const P = App.play, a = P.acts[P.i];
  setHud(`<button class="rbtn" id="bBack" aria-label="Torna alla mappa">${I.back}</button><div class="pips">${P.acts.map((_, i) => `<span class="pip${i < P.i ? ' done' : i === P.i ? ' now' : ''}"></span>`).join('')}</div>${toggles()}`);
  $('#bBack').onclick = () => { Voice.stop(); screenMap(); };
  const s = $('#screen'); s.innerHTML = '';
  const wrap = el('section', 'act');
  const coach = el('div', 'coach'); const fox = foxEl(); coach.appendChild(fox);
  const bub = el('div', 'bubble'); const pt = el('span', 'pt'); pt.textContent = a.prompt; bub.appendChild(pt);
  const sp = el('button', 'spk', I.voice); sp.setAttribute('aria-label', 'Ascolta'); sp.onclick = () => Voice.say(a.say); bub.appendChild(sp);
  coach.appendChild(bub);
  const stage = el('div', 'stage'); const dock = el('div', 'dock');
  wrap.append(coach, stage, dock); s.appendChild(wrap);
  let curMist = 0, finished = false;
  const api = {
    get mist() { return curMist; },
    ok(sayFirst) {
      if (finished) return; finished = true;
      if (curMist === 0) weakDown(a.key);
      Aud.good(); confetti(50);
      const pr = pick(PRAISE); pt.textContent = pr;
      fox.classList.remove('oops'); void fox.offsetWidth; fox.classList.add('happy');
      const myI = P.i;
      Voice.say(sayFirst || pr).then(() => { if (sayFirst && App.view === 'play' && App.play === P && P.i === myI) Voice.say(pr); });
      const last = P.i === P.acts.length - 1;
      const nb = el('button', 'cta pulse', (last ? 'Finito' : 'Avanti') + ' ' + I.arrow);
      nb.onclick = () => { Voice.stop(); P.i++; if (P.i >= P.acts.length) finishLevel(); else renderAct(); };
      dock.appendChild(nb);
    },
    bad(k) {
      curMist++; P.mist++; weakUp(k || a.key); Aud.oops();
      pt.textContent = pick(RETRY);
      fox.classList.remove('happy'); void fox.offsetWidth; fox.classList.add('oops');
    },
    say: t => Voice.say(t),
    stage, a
  };
  ACT[a.type](stage, a, api);
  setTimeout(() => { if (App.view === 'play' && App.play === P && P.acts[P.i] === a) Voice.say(a.say); }, 450);
}
function finishLevel() {
  cleanup(); const P = App.play; App.view = 'win'; Voice.stop();
  const stars = P.mist <= 1 ? 3 : P.mist <= 4 ? 2 : 1;
  let first = false, gained = 0;
  if (P.review) { gained = 1; SAVE.stars += 1; }
  else {
    const id = lid(P.wi, P.li), prev = SAVE.done[id] || 0; first = !prev;
    gained = Math.max(0, stars - prev); SAVE.stars += gained; SAVE.done[id] = Math.max(prev, stars);
  }
  save();
  setHud(starBox());
  const s = $('#screen'); s.innerHTML = '';
  const w = el('div', 'win');
  const stIdx = P.wi * 3 + P.li;
  const lastAll = !P.review && doneCount() >= TOTAL && !SAVE.diploma;
  w.innerHTML = `<h2>${P.review ? 'Ripasso fatto!' : lastAll ? 'Hai finito tutto!' : 'Livello finito!'}</h2><div class="bigstars">${[1, 2, 3].map(n => star(n <= stars)).join('')}</div>`;
  if (first) { w.appendChild(el('div', 'sticker', STICKERS[stIdx])); w.appendChild(el('div', 'lbl', 'Nuova figurina per l\'album!')); }
  else if (P.review) w.appendChild(el('div', 'lbl', '+1 stella bonus'));
  else if (gained) w.appendChild(el('div', 'lbl', '+' + gained + (gained === 1 ? ' stella' : ' stelle') + ' in più'));
  const rb = el('div', 'rowbtns');
  const cont = el('button', 'cta', lastAll ? 'Il diploma' : 'Continua'); cont.onclick = () => lastAll ? screenDiploma() : screenMap();
  rb.appendChild(cont);
  if (!P.review) { const again = el('button', 'cta sun', 'Rigioca'); again.onclick = () => startLevel(P.wi, P.li); rb.appendChild(again); }
  w.appendChild(rb); s.appendChild(w);
  Aud.win(); confetti(120);
  stars >= 1 && [0, 1, 2].forEach(i => { if (i < stars) setTimeout(() => Aud.star(i), 250 + i * 250); });
  if (first) setTimeout(() => Aud.sticker(), 900);
  Voice.say(stars === 3 ? 'Bravissima ' + NAME + '! Tre stelle!' : 'Brava ' + NAME + '!');
}

ACT.match = (st, a, api) => {
  const L = shuffle(a.pairs), R = shuffle(a.pairs), grid = el('div', 'mcols');
  let sel = null, got = 0; const all = [];
  const click = (b, side, w) => {
    if (sel && sel.side !== side) {
      const e = side === 'e' ? w : sel.w, t = side === 'e' ? sel.w : w;
      if (e.w === t.w) {
        [b, sel.b].forEach(x => { x.classList.remove('sel'); x.classList.add('done'); }); Aud.pop(got + 1); got++; sel = null;
        if (got === a.pairs.length) api.ok();
      } else { [b, sel.b].forEach(x => { x.classList.remove('sel'); wrongFlash(x); }); sel = null; api.bad('W:' + e.w); }
    } else {
      if (sel) sel.b.classList.remove('sel');
      sel = { b, side, w }; b.classList.add('sel'); Aud.pop(0);
      if (side === 'w') Voice.say(w.w.toLowerCase());
    }
  };
  for (let i = 0; i < a.pairs.length; i++) {
    const be = el('button', 'opt pic2', ''); be.textContent = L[i].e; be.onclick = () => click(be, 'e', L[i]);
    const bw = el('button', 'opt wordc'); bw.textContent = R[i].w; bw.onclick = () => click(bw, 'w', R[i]);
    grid.append(be, bw); all.push(be, bw);
  }
  st.appendChild(grid);
};

ACT.compose = (st, a, api) => {
  const letters = a.target.split('');
  let pic = null;
  if (a.emoji) { pic = el('div', 'pic' + (a.emoji.length > 3 ? ' sm' : ''), a.emoji); st.appendChild(pic); }
  if (a.hideEmoji && pic) {
    pic.hidden = true;
    const sp = bigSpeaker(api, a.say); st.insertBefore(sp, pic);
    const hb = el('button', 'hintbtn', 'Aiuto: guarda il disegno'); hb.onclick = () => { pic.hidden = false; hb.remove(); }; st.appendChild(hb);
  } else if (a.listenFirst) { /* dettato con disegno: nulla di più */ }
  const slotsEl = el('div', 'slots'), slots = [];
  a.sylls.forEach(sy => { const g = el('div', 'syl'); sy.split('').forEach(ch => { const s = el('div', 'slot' + (a.model ? ' ghost' : ''), a.model ? ch : ''); g.appendChild(s); slots.push(s); }); slotsEl.appendChild(g); });
  st.appendChild(slotsEl);
  const extra = sample(ALPHA.filter(x => !letters.includes(x)), a.extra);
  const tl = shuffle(letters.concat(extra)), n = tl.length;
  st.style.setProperty('--tile', n <= 6 ? 'clamp(58px, 16vw, 112px)' : n <= 9 ? 'clamp(50px, 12.5vw, 96px)' : n <= 12 ? 'clamp(44px, 10.2vw, 80px)' : 'clamp(38px, 8vw, 66px)');
  const row = optRow(); const btns = [];
  let pos = 0, fin = false;
  const mark = () => { slots.forEach((s, i) => s.classList.toggle('cur', i === pos)); btns.forEach(b => b.classList.toggle('hl', api.mist >= 3 && !b.disabled && b.dataset.l === letters[pos])); };
  tl.forEach((L, i) => {
    const b = el('button', 'tile c' + (i % 5)); b.textContent = L; b.dataset.l = L;
    b.onclick = () => {
      if (fin) return;
      if (L === letters[pos]) {
        const s = slots[pos]; s.textContent = L; s.classList.remove('ghost'); s.classList.add('fill');
        b.classList.add('used'); b.disabled = true; Aud.pop(pos % 6); pos++;
        if (pos === letters.length) {
          fin = true; slots.forEach(x => x.classList.remove('cur')); slotsEl.classList.add('done'); if (pic) pic.hidden = false;
          st.querySelectorAll('.hintbtn').forEach(x => x.remove()); api.ok(a.say);
        } else mark();
      } else { wrongFlash(b); api.bad(); mark(); }
    };
    row.appendChild(b); btns.push(b);
  });
  st.appendChild(row); mark();
};

ACT.bubbles = (st, a, api) => {
  const field = el('div', 'field'); st.appendChild(field);
  const info = el('div', 'bubinfo'); for (let i = 0; i < a.goal; i++) info.appendChild(el('i')); field.appendChild(info);
  const sp = bigSpeaker(api, a.speakTarget); sp.style.cssText = 'position:absolute;right:10px;top:8px;z-index:3;width:56px;height:56px'; field.appendChild(sp);
  const items = [];
  const texts = [];
  for (let i = 0; i < a.goal; i++) texts.push({ t: a.target, hit: true });
  shuffle(a.pool).slice(0, 4).forEach(t => texts.push({ t, hit: false }));
  const size = innerWidth < 480 ? 80 : 94;
  let popped = 0, run = true, last = 0;
  const FW = () => field.clientWidth, FH = () => field.clientHeight;
  texts.forEach((o, i) => {
    const b = el('div', 'bub'); b.textContent = o.t; b.style.width = b.style.height = size + 'px'; b.style.fontSize = Math.round(size * 0.44) + 'px'; field.appendChild(b);
    const it = { b, hit: o.hit, x: 20 + Math.random() * Math.max(10, (FW() || 300) - size - 40), y: 40 + Math.random() * Math.max(10, (FH() || 260) - size - 60), vx: (Math.random() < .5 ? -1 : 1) * (28 + Math.random() * 34), vy: (Math.random() < .5 ? -1 : 1) * (22 + Math.random() * 30), alive: true };
    items.push(it);
    b.addEventListener('pointerdown', e => {
      e.preventDefault(); if (!it.alive || !run) return;
      if (it.hit) {
        it.alive = false; b.classList.add('pop'); Aud.bubble(); Voice.say(a.speakTarget); popped++;
        info.children[popped - 1] && info.children[popped - 1].classList.add('on');
        setTimeout(() => b.remove(), 400);
        if (popped >= a.goal) { run = false; items.forEach(x => { if (x.alive && !x.hit) { x.b.style.opacity = .5; } }); api.ok(); }
      } else { b.classList.remove('wob'); void b.offsetWidth; b.classList.add('wob'); api.bad(); }
    });
  });
  function frame(t) {
    if (!field.isConnected) return;
    const dt = Math.min(0.05, (t - last) / 1000 || 0.016); last = t;
    const W = FW() - size, H = FH() - size;
    items.forEach(it => {
      if (!it.alive) return;
      it.x += it.vx * dt; it.y += it.vy * dt;
      if (it.x < 0) { it.x = 0; it.vx = Math.abs(it.vx); } if (it.x > W) { it.x = W; it.vx = -Math.abs(it.vx); }
      if (it.y < 0) { it.y = 0; it.vy = Math.abs(it.vy); } if (it.y > H) { it.y = H; it.vy = -Math.abs(it.vy); }
      const tr = `translate(${it.x.toFixed(1)}px,${it.y.toFixed(1)}px)`;
      it.b.style.setProperty('--tr', tr); if (!it.b.classList.contains('pop') && !it.b.classList.contains('wob')) it.b.style.transform = tr;
    });
    raf = requestAnimationFrame(frame);
  }
  let raf = requestAnimationFrame(frame);
  api_cleanup(() => { cancelAnimationFrame(raf); run = false; });
};
const api_cleanup = f => App.cleanups.push(f);

ACT.trace = (st, a, api) => {
  const S = 360, dpr = Math.min(window.devicePixelRatio || 1, 2);
  const wrap = el('div', 'tracewrap'), base = el('canvas'), paint = el('canvas');
  [base, paint].forEach(c => { c.width = S * dpr; c.height = S * dpr; }); wrap.append(base, paint); st.appendChild(wrap);
  const meter = el('div', 'meter', '<i></i>'); st.appendChild(meter);
  const ch = SAVE.upper ? a.letter : a.letter.toLowerCase();
  const size = SAVE.upper ? S * 0.8 : S * 0.92;
  const font = `800 ${size}px "Baloo 2","Nunito","Arial Rounded MT Bold",Arial,sans-serif`;
  let alive = true; api_cleanup(() => { alive = false; });
  const go = () => {
    if (!alive) return;
    const mask = document.createElement('canvas'); mask.width = mask.height = S;
    const mc = mask.getContext('2d'); mc.font = font; mc.textAlign = 'center'; mc.textBaseline = 'alphabetic';
    const m = mc.measureText(ch); const asc = m.actualBoundingBoxAscent || size * 0.7, desc = m.actualBoundingBoxDescent || 0;
    const y = S / 2 + (asc - desc) / 2; mc.fillStyle = '#000'; mc.fillText(ch, S / 2, y);
    const md = mc.getImageData(0, 0, S, S).data;
    const inside = (x, yy) => { x = Math.round(x); yy = Math.round(yy); if (x < 0 || yy < 0 || x >= S || yy >= S) return false; return md[(yy * S + x) * 4 + 3] > 110; };
    const pts = []; for (let yy = 4; yy < S; yy += 6) for (let x = 4; x < S; x += 6) if (inside(x, yy)) pts.push({ x, y: yy, c: false });
    const total = Math.max(1, pts.length); let covered = 0;
    const bc = base.getContext('2d'); bc.scale(dpr, dpr); bc.font = font; bc.textAlign = 'center'; bc.textBaseline = 'alphabetic';
    bc.fillStyle = '#EDE6FF'; bc.fillText(ch, S / 2, y); bc.setLineDash([2, 9]); bc.lineCap = 'round'; bc.lineWidth = 3.5; bc.strokeStyle = '#8E7CE0'; bc.strokeText(ch, S / 2, y);
    const pc = paint.getContext('2d'); pc.scale(dpr, dpr);
    let drawing = false, lastP = null, fin = false;
    const pos = e => { const r = paint.getBoundingClientRect(); return { x: (e.clientX - r.left) * S / r.width, y: (e.clientY - r.top) * S / r.height }; };
    const mark = (x, yy) => { for (const p of pts) if (!p.c && (p.x - x) * (p.x - x) + (p.y - yy) * (p.y - yy) < 600) { p.c = true; covered++; } };
    const stamp = (x, yy) => { if (!inside(x, yy)) return; pc.fillStyle = '#FF8A3D'; pc.beginPath(); pc.arc(x, yy, 19, 0, 6.3); pc.fill(); mark(x, yy); };
    const seg = (p, q) => { const d = Math.hypot(q.x - p.x, q.y - p.y), n = Math.max(1, Math.ceil(d / 4)); for (let i = 1; i <= n; i++) stamp(p.x + (q.x - p.x) * i / n, p.y + (q.y - p.y) * i / n); };
    const upd = () => {
      const f = covered / total; meter.firstChild.style.width = Math.min(100, f / 0.8 * 100) + '%';
      if (f >= 0.8 && !fin) {
        fin = true; pc.fillStyle = '#2FCB8E'; pc.font = font; pc.textAlign = 'center'; pc.textBaseline = 'alphabetic'; pc.fillText(ch, S / 2, y);
        Aud.pop(4); api.ok(LETTER_SAY[a.letter]);
      }
    };
    paint.addEventListener('pointerdown', e => { e.preventDefault(); if (fin) return; try { paint.setPointerCapture(e.pointerId); } catch (_) { } drawing = true; lastP = pos(e); stamp(lastP.x, lastP.y); upd(); });
    paint.addEventListener('pointermove', e => { if (fin) return; if (!drawing) { if (e.buttons & 1) { drawing = true; lastP = pos(e); } else return; } const p = pos(e); seg(lastP, p); lastP = p; upd(); });
    const end = () => { drawing = false; };
    paint.addEventListener('pointerup', end); paint.addEventListener('pointercancel', end); paint.addEventListener('pointerleave', end);
  };
  const ready = (document.fonts && document.fonts.load) ? Promise.race([document.fonts.load('800 80px "Baloo 2"'), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
  ready.then(go, go);
};
